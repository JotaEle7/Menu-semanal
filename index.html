<style>
/* VOICE: cocina de casa, directo, sin adornos
   IDEA: la libreta de menú pegada en la nevera + el modo guiado de un robot de cocina
   PICTURE: la semana entera como lista de platos; el paso a paso a pantalla completa
   COLOUR and TYPE: blanco, tinta, rojo tomate de acento, verde hoja de apoyo; Rubik
   LAYOUT: una columna, barra inferior fija, modo cocina a pantalla completa */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141513);--card:light-dark(#f4f3f0,#1f211e);--ink:light-dark(#1b1d1a,#efeee9);--mute:light-dark(#62655e,#a3a69d);--line:light-dark(#e2e0db,#30332e);--acc:#d8432a;--acc2:light-dark(#4f7a33,#8fbf6a);--ok:light-dark(#4f7a33,#8fbf6a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px max(4vw,16px)}
header.top{background:var(--acc);color:#fff;padding:calc(18px + env(safe-area-inset-top)) max(4vw,16px) 22px}
header.top .in{max-width:640px;margin:0 auto}
.wk{display:flex;align-items:center;gap:8px}
.wk h1{flex:1;margin:0;font-size:32px;line-height:1.05;font-weight:800;text-wrap:balance}
.wk button{width:44px;height:44px;border-radius:50%;border:2px solid #ffffff88;background:transparent;color:#fff;font-size:20px}
.sub{margin:6px 0 0;font-size:15px;opacity:.92}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.stat div{background:#ffffff22;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.2}
.stat b{display:block;font-size:20px;line-height:1.1;white-space:nowrap}
.day{margin:14px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day h2{margin:0;padding:10px 14px;font-size:15px;font-weight:700;background:var(--card);display:flex;justify-content:space-between}
.day h2 span{color:var(--mute);font-weight:400}
.dish{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.dish .k{font-size:13px;color:var(--mute);width:54px;flex:none}
.dish .n{flex:1}.dish .n b{display:block;font-weight:500;line-height:1.25}.dish .n small{color:var(--mute);font-size:13px}
.dish.done .n b{text-decoration:line-through;color:var(--mute)}
.night{padding:10px 14px;border-top:1px dashed var(--line);font-size:14px;color:var(--acc2);font-weight:500}
.go.big{width:100%;height:56px;margin:14px 0 4px;font-size:17px}
#rs{width:100%;height:48px;font:inherit;font-size:16px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:6px 0 10px}
.chips{display:flex;gap:8px;padding-bottom:6px;margin-bottom:6px}.chip{flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.srv{display:flex;align-items:center;gap:14px;margin:4px 0 8px}.srv b{font-size:22px;min-width:24px;text-align:center}
.steps{padding-left:22px}.steps li{margin:0 0 10px}
.mini{border:0;background:var(--card);border-radius:10px;width:28px;height:28px;font-size:12px;vertical-align:middle}
.go{flex:none;height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--acc);color:#fff;font-weight:700}
.dish.done .go{background:var(--ok)}
h3{font-size:20px;margin:22px 0 8px}
.sec{font-size:13px;color:var(--mute);margin:18px 0 6px;font-weight:500}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:6px 0;text-align:left}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--mute);flex:none;display:grid;place-items:center;color:#fff;font-size:16px}
.item.on .box{background:var(--ok);border-color:var(--ok)}
.item.on .nm{text-decoration:line-through;color:var(--mute)}
.item .nm{flex:1}.item .q{color:var(--mute);font-size:14px;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--card);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc2)}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.row .t{display:flex;justify-content:space-between;gap:8px}.row .t span{color:var(--mute);white-space:nowrap;font-size:14px}
.tip{background:var(--card);border-radius:14px;padding:12px 14px;font-size:15px;margin:14px 0}
.tip b{color:var(--acc)}
.ghost{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:transparent}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;height:64px;border:0;background:transparent;font-size:13px;padding:0 2px;color:var(--mute);font-weight:500}
nav.tabs button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
/* modo cocina */
#cook{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
#cook.open{display:flex}
.ch{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
.ch b{flex:1;line-height:1.2}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px}
.prog{height:6px;background:var(--card)}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.cb{flex:1;overflow:auto;padding:22px 20px;max-width:640px;width:100%;margin:0 auto}
.stepn{font-size:14px;color:var(--acc);font-weight:700}
.stept{font-size:clamp(24px,6.4vw,34px);line-height:1.25;font-weight:500;margin:10px 0 22px;text-wrap:pretty}
.ings .item{min-height:48px}
.tbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:64px;border-radius:18px;border:2px solid var(--acc);background:transparent;color:var(--acc);font-size:20px;font-weight:700}
.cf{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);max-width:640px;width:100%;margin:0 auto}
.cf button{flex:1;height:60px;border-radius:18px;font-size:18px;font-weight:700}
.prev{border:1px solid var(--line);background:transparent}
.next{border:0;background:var(--acc);color:#fff}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:20;display:none;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:30px;box-shadow:0 6px 24px #0004}
#timer.show{display:flex}#timer b{font-size:26px;font-variant-numeric:tabular-nums}
#timer.ring{background:var(--acc);color:#fff;animation:pul 1s infinite}
#timer button{height:40px;padding:0 14px;border-radius:20px;border:0;background:#ffffff33;color:inherit;font-weight:700}
@keyframes pul{50%{transform:translateX(-50%) scale(1.06)}}
@media(prefers-reduced-motion:reduce){#timer.ring{animation:none}.prog i{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="in">

</div></header>
<main class="wrap" id="view"></main>

</div>

const domSteps=r=>{const b=BC[r.id];return b.dom==='p'?r.p:(b.dom||[])};
const diaSteps=r=>{const b=BC[r.id];return b.dia==='p'?r.p:b.dia};
const noFreeze=r=>BC[r.id].m!=='fresh'&&BC[r.id].fz===0;
const needsDom=r=>domSteps(r).length>0;
// dónde se guarda lo del domingo según el día (0 = lunes)
const store=(r,d)=>{const b=BC[r.id];if(!needsDom(r))return 'dia';if(b.raw)return d<=1?'nevera':'congelador';return d<=2?'nevera':(b.fz?'congelador':'nevera')};
const weekMin=r=>Math.max(2,Math.round(diaSteps(r).reduce((s,x)=>s+(x[1]||60),0)/60)+1);
const thaw=(r,d)=>store(r,d)==='congelador'||!!r.i.merluza;

const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const fmt=q=>{q=Math.round(q*4)/4;const w=Math.floor(q),f=q-w;const fr=f===.75?'¾':f===.5?'½':f===.25?'¼':'';return (w?w:(fr?'':'0'))+fr};
const qty=(id,q)=>{const u=ING[id].u;return u==='g'?`${Math.round(q)} g`:`${fmt(q)} ${u}${u==='ud'?'':(q>1?'s':'')}`.replace('dientess','dientes')};
const monday=d=>{d=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d};
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuffle=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const kcal=r=>Math.round((Object.entries(r.i).reduce((s,[id,q])=>s+q*KC[id],0)+OIL[r.id]*90)/10)*10;
const cost=r=>Object.entries(r.i).reduce((s,[id,q])=>s+q/ING[id].q*PR[id],0)+OIL[r.id]*OIL_EUR;
const eur=v=>v.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const COMPRA=Object.values(PR).reduce((a,b)=>a+b,0);
const STOCK=Object.fromEntries(Object.entries(ING).map(([k,v])=>[k,v.q]));

// ---------- PLANIFICADOR ----------
function build(k,avoid){
  const r=rng(hash(k));let best=null,bs=-1e9;
  for(let t=0;t<1500;t++){
    const st={...STOCK},C=[],N=[];
    for(const x of shuffle(R.slice(),r)){
      if(C.length>=7&&N.length>=7)break;
      if(Object.entries(x.i).some(([id,q])=>st[id]<q-1e-9))continue;
      let s=null;
      if(x.t==='c')s=C.length<7?C:null;
      else if(x.t==='n')s=N.length<7?N:null;
      else s=(C.length<=N.length?(C.length<7?C:N.length<7?N:null):(N.length<7?N:C.length<7?C:null));
      if(!s)continue;
      if(noFreeze(x)&&s.filter(noFreeze).length>=3)continue;
      for(const[id,q]of Object.entries(x.i))st[id]-=q;
      s.push(x);
    }
    let sc=(C.length+N.length)*10;
    for(const id in ING)sc+=(STOCK[id]-st[id])/STOCK[id]*(ING[id].p?(URG[id]?6:3):.2);
    if(avoid)sc-=[...C,...N].filter(x=>avoid.has(x.id)).length*.8;
    if(sc>bs){bs=sc;best={C,N,st}}
  }
  const urg=x=>Math.max(0,...Object.keys(x.i).map(id=>URG[id]||0))+(x.i.merluza?-1:0);
  const key2=x=>(noFreeze(x)?10:0)+urg(x);best.C.sort((a,b)=>key2(b)-key2(a));best.N.sort((a,b)=>key2(b)-key2(a));
  return best;
}
const cache={};
function plan(k){
  if(cache[k])return cache[k];
  const d=new Date(k);d.setDate(d.getDate()-7);
  const prev=build(key(d),null);
  return cache[k]=build(k,new Set([...prev.C,...prev.N].map(x=>x.id)));
}

const UN={cda:['cucharada','cucharadas'],cdta:['cucharadita','cucharaditas'],diente:['diente','dientes'],hoja:['hoja','hojas']};
const fq=q=>{if(q>=20)return String(Math.round(q/5)*5);return fmt(q)};
const rq=(q,u)=>u==='pizca'?'una pizca':UN[u]?`${fq(q)} ${UN[u][q>1?1:0]}`:`${fq(q)} ${u}`;
const lowname=n=>n.replace(/\s*\(.*?\)/g,'').toLowerCase();
const plur=(w,q)=>q>1?w.replace(/^(\S+)/,m=>/[aeiouáéó]$/.test(m)?m+'s':m+'es'):w;
function tok(r,k,sc){const [q0,u,n]=r.i[k],q=adj(q0*sc,u,n),nm=lowname(n);
  if(u==='ud')return `${fq(q)} ${plur(nm,q)}`;
  if(u==='pizca')return `una pizca de ${nm}`;
  return `${rq(q,u)} de ${nm}`}
const rsc=(r,s)=>r.fx?1:s/r.b;
// ajusta cantidades contables: huevos enteros, el resto a medias unidades
const adj=(q,u,n)=>u==='ud'||u==='diente'||u==='hoja'?(/^(huevo|yema)/i.test(n)?Math.max(1,Math.round(q)):Math.max(.5,Math.round(q*2)/2)):q;
const rtext=(r,t,sc)=>t.replace(/\{(\d+)\}/g,(m,k)=>tok(r,+k,sc));

function header(){
  const d=wkDate(),e=new Date(d);e.setDate(e.getDate()+6);

  $('#wt').textContent=off===0?'Esta semana':off===1?'Semana que viene':off===-1?'Semana pasada':`Semana del ${f(d)}`;
  $('#wd').textContent=`${f(d)} – ${f(e)} · misma compra, platos distintos`;
  const p=plan(wk());const per=Object.keys(ING).filter(id=>ING[id].p);
  const use=Math.round(per.reduce((s,id)=>s+(STOCK[id]-p.st[id])/STOCK[id],0)/per.length*100);
  const done=ls.get('mc_done_'+wk(),[]).length;

  $('#st').innerHTML=`<div><b>${Math.round(COMPRA)} €</b>compra</div><div><b>${use}%</b>usado</div><div><b>${kd}</b>kcal/día*</div><div><b>${done}/${all.length}</b>hechos</div>`;
}

const LAB={full:'Calentar',part:'Terminar',fresh:'Preparar'};
const slotName=s=>`${DAYS[+s.slice(1)]} · ${s[0]==='c'?'comida':'cena'}`;
function vMenu(){
  const p=plan(wk()),done=ls.get('mc_done_'+wk(),[]);
  const d0=wkDate();
  const dish=(x,slot,lab,d)=>{if(!x)return '';const st=store(x,d),dn=done.includes(slot);
    const where=st==='dia'?'se prepara el mismo día':`del domingo, en ${st==='nevera'?'la nevera':'el congelador'}`;
    return `<div class="dish ${dn?'done':''}"><span class="k">${lab}</span><div class="n"><b>${x.n}</b><small>${kcal(x)} kcal · ${eur(cost(x))} · ${weekMin(x)} min el día<br>${where}</small></div><button class="go" data-c="${x.id}" data-s="${slot}">${dn?'Hecho':LAB[BC[x.id].m]}</button></div>`};

    const dk=(p.C[i]?kcal(p.C[i]):0)+(p.N[i]?kcal(p.N[i]):0);

    const night=i<6&&nx.length?`<div class="night">Esta noche: pasa del congelador a la nevera ${nx.map(x=>[store(x,i+1)==='congelador'?'el táper':'',x.i.merluza?'la merluza':''].filter(Boolean).join(' y ')+' de «'+x.n+'»').join('; ')}.</div>`:'';

function sunday(){
  const p=plan(wk()),list=[];
  p.C.forEach((x,d)=>list.push({r:x,d,slot:'c'+d}));p.N.forEach((x,d)=>list.push({r:x,d,slot:'n'+d}));
  const cook=list.filter(o=>needsDom(o.r));
  const A=list.reduce((s,o)=>s+(BC[o.r.id].A||0),0),P=list.reduce((s,o)=>s+(BC[o.r.id].P||0),0),H=list.reduce((s,o)=>s+(BC[o.r.id].H||0),0);
  const secs=cook.reduce((s,o)=>s+domSteps(o.r).reduce((a,x)=>a+(x[1]||0),0),0);
  const mins=Math.round((secs*.6+cook.length*240+(A||P?600:0))/60/5)*5;
  cook.sort((a,b)=>domSteps(b.r).reduce((s,x)=>s+(x[1]||0),0)-domSteps(a.r).reduce((s,x)=>s+(x[1]||0),0));
  return {list,cook,A,P,H,mins};
}
const hm=m=>m>=60?`${Math.floor(m/60)} h ${m%60?m%60+' min':''}`:`${m} min`;
function vDomingo(){
  const S=sunday(),dn=ls.get('mc_sun_'+wk(),false);
  const grp=w=>S.list.filter(o=>store(o.r,o.d)===w);
  const row=o=>`<div class="row"><div class="t"><b style="font-weight:500">${o.r.n}</b><span>${slotName(o.slot)}</span></div></div>`;
  const nev=grp('nevera'),con=grp('congelador'),dia=grp('dia');
  return `<h3>Sesión del domingo</h3>
  <p style="margin:0;color:var(--mute)">${S.cook.length} platos al fuego, unas ${hm(S.mins)} con dos fuegos y el horno a la vez. Necesitas ${S.cook.length} tápers.</p>
  <button class="go big" id="sun">${dn?'Hecho · repetir sesión':'Empezar sesión del domingo'}</button>
  ${S.A||S.P||S.H?`<div class="tip">Primero cueces de una vez ${[S.A?S.A+' g de arroz':'',S.P?S.P+' g de macarrones':'',S.H?S.H+' huevos duros':''].filter(Boolean).join(', ')} para toda la semana.</div>`:''}
  <div class="sec">A la nevera · lunes a miércoles (${nev.length})</div>${nev.map(row).join('')}

  <div class="tip"><b>Reglas:</b> deja templar y mete los tápers en la nevera antes de 2 horas. En la nevera, como mucho 3 días. Lo del congelador pásalo a la nevera la noche antes; la app te avisa cada día en el menú. Las patatas y los fritos no se congelan bien, por eso van de lunes a miércoles.</div>`;
}

  <p style="margin:0;color:var(--mute)">${r.c} · ${r.m} min · ${r.k} kcal por ración</p>
  <div class="tip"><b>Menaje:</b> ${r.u}</div>
  ${r.fx?`<p style="margin:0 0 8px">Receta para un molde: salen ${r.b} raciones.</p>`:`<div class="srv"><span>Raciones</span><button class="x" data-rs="-1" aria-label="Menos">−</button><b>${rsrv}</b><button class="x" data-rs="1" aria-label="Más">+</button></div>`}
  <div class="sec">Ingredientes</div>
  ${r.i.map(([q,u,n])=>`<div class="row"><div class="t"><span style="color:var(--ink)">${n}</span><span>${rq(adj(q*sc,u,n),u)}</span></div></div>`).join('')}
  <p style="color:var(--mute);font-size:14px">Y sal, y lo que tengas de despensa.</p>
  <button class="go big" data-rcook="1">Cocinar paso a paso</button>
  <div style="display:flex;gap:8px"><button class="ghost" style="flex:1" data-rfav="1">${fav?'★ Favorita':'☆ Favorita'}</button><button class="ghost" style="flex:1" data-radd="1">${inl?'✓ En tu lista':'+ A la compra'}</button></div>
  <div class="sec">Pasos</div>
  <ol class="steps">${r.p.map(([t,s])=>`<li>${rtext(r,t,sc)}${s?` <small style="color:var(--mute)">(${Math.round(s/60)} min)</small>`:''}</li>`).join('')}</ol>`;
}
function rShop(){
  const L=ls.get('mc_rlist',[]);if(!L.length)return '';
  const chk=ls.get('mc_rchk',[]),agg={};
  L.forEach(({id,s})=>{const r=RB.find(x=>x.id===id);if(!r)return;const sc=rsc(r,s);
    r.i.forEach(([q,u,n])=>{const k=n+'|'+u;agg[k]=agg[k]||{n,u,q:0};agg[k].q+=q*sc})});
  const items=Object.entries(agg).sort((a,b)=>a[1].n.localeCompare(b[1].n));
  return `<h3>Compra de recetas</h3>
  <p style="margin:0;color:var(--mute)">${L.map(({id,s})=>{const r=RB.find(x=>x.id===id);return `${r.n} (${r.fx?r.b:s}) <button class="mini" data-rdel="${id}" aria-label="Quitar ${r.n}">✕</button>`}).join(' · ')}</p>`+
  items.map(([k,v])=>`<button class="item ${chk.includes(k)?'on':''}" data-rk="${k}"><span class="box">${chk.includes(k)?'✓':''}</span><span class="nm">${v.n}</span><span class="q">${v.u==='pizca'?'un poco':rq(['ud','diente','hoja'].includes(v.u)?Math.ceil(v.q-1e-9):v.q,v.u)}</span></button>`).join('')+
  `<button class="ghost" id="rclear">Vaciar lista de recetas</button>`;
}
function openRB(){
  const r=RB.find(x=>x.id===rsel),sc=rsc(r,rsrv);
  openFlow({title:r.n,steps:r.p.map(([t,s])=>({h:'',t:rtext(r,t,sc),s})),ingList:r.i.map(([q,u,n],k)=>({k:r.id+k,label:n,q:rq(adj(q*sc,u,n),u)})),meta:`${r.fx?r.b:rsrv} raciones · ${r.k} kcal/ración`});
}

function vCompra(){
  const on=ls.get('mc_buy_'+wk(),[]);const secs=[...new Set(Object.values(ING).map(v=>v.s))];
  const n=on.length,t=Object.keys(ING).length;
  return rShop()+`<h3>Lista de la compra del menú · ${eur(COMPRA)}</h3><p style="margin:0;color:var(--mute)">Para 1 persona, 14 platos. ${n} de ${t} en el carro. Es la misma lista todas las semanas.</p>
  <div class="bar"><i style="width:${n/t*100}%"></i></div>`+
  secs.map(s=>`<div class="sec">${s}</div>`+Object.entries(ING).filter(([,v])=>v.s===s).map(([id,v])=>
    `<button class="item ${on.includes(id)?'on':''}" data-b="${id}"><span class="box">${on.includes(id)?'✓':''}</span><span class="nm">${v.n}</span><span class="q">${v.b}<br>${EST[id]?'≈ ':''}${eur(PR[id])}</span></button>`).join('')).join('')+
  `<p style="font-size:13px;color:var(--mute)">Precios de la tienda online de Mercadona, copiados por el comparador Findit (noviembre de 2026). Los marcados con ≈ son estimados. En tu tienda pueden variar unos céntimos; la fruta y la verdura se pesan.</p>`+
  `<div class="tip"><b>Tienes que tener en casa</b> (≈ ${eur(DESPENSA_SEM)} a la semana): ${ALWAYS}</div>
   <div class="tip"><b>Al llegar:</b> si compras el sábado, el domingo lo cocinas todo en la pestaña «Domingo». Si compras antes, congela el pollo y la carne hasta el domingo.</div>
   <button class="ghost" id="reset">Desmarcar todo</button>`;
}

function vSobras(){
  const p=plan(wk()),all=[...p.C,...p.N];
  const rows=Object.entries(ING).map(([id,v])=>{const u=STOCK[id]-p.st[id],pc=Math.round(u/STOCK[id]*100);
    return {id,v,u,pc,left:p.st[id]}}).sort((a,b)=>a.pc-b.pc);
  return `<div class="tip">Lo que comes esta semana vale <b>${eur(all.reduce((s,x)=>s+cost(x),0))}</b>, unos <b>${eur(all.reduce((s,x)=>s+cost(x),0)/all.length)}</b> por plato. Lo que sobra (${eur(COMPRA-all.reduce((s,x)=>s+cost(x)-OIL[x.id]*OIL_EUR,0))}) queda para la semana siguiente.</div><h3>Qué se gasta esta semana</h3><p style="margin:0 0 6px;color:var(--mute)">Lo que sobra de despensa (arroz, pasta, patata, ajo) aguanta para la semana siguiente.</p>`+
  rows.map(r=>`<div class="row"><div class="t"><b style="font-weight:500">${r.v.n}</b><span>${r.left>0.01?'sobra '+qty(r.id,r.left):'se gasta todo'}</span></div><div class="bar"><i style="width:${r.pc}%;${r.v.p?'':'background:var(--mute)'}"></i></div></div>`).join('');
}

function render(){
  header();
  $('#view').innerHTML=tab==='menu'?vMenu():tab==='domingo'?vDomingo():tab==='recetas'?vRecetas():tab==='compra'?vCompra():vSobras();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}

// ---------- TEMPORIZADOR ----------
let T=null,actx=null,wl=null;
const unlock=()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}};
const beep=()=>{try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.3,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6)}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}};
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function startTimer(sec,label){
  unlock();stopTimer();
  const end=Date.now()+sec*1000;$('#tl').textContent=label;$('#timer').classList.add('show');
  T=setInterval(()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));$('#tt').textContent=mmss(r);
    if(r===0){$('#timer').classList.add('ring');beep();$('#tstop').textContent='OK'}},500);
  $('#tt').textContent=mmss(sec);
}
function stopTimer(){clearInterval(T);T=null;$('#timer').classList.remove('show','ring');$('#tstop').textContent='Parar'}

// ---------- MODO COCINA ----------
let C=null;
function openFlow(o){
  C=Object.assign({i:o.ingList?-1:0},o);$('#cook').classList.add('open');document.body.style.overflow='hidden';
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wl=w).catch(()=>{})}catch(e){}
  drawCook();
}
function openDish(id,slot){
  const r=R.find(x=>x.id===id),d=+slot.slice(1),st=store(r,d),b=BC[id];
  const steps=[];
  if(st!=='dia')steps.push({h:'Del domingo',t:`Saca el táper «${slotName(slot)} – ${r.n}» de la nevera.${b.m==='full'?'':' Lleva la base hecha.'}`});
  diaSteps(r).forEach(([t,s])=>steps.push({h:'',t,s}));
  openFlow({title:r.n,steps,ingList:st==='dia'?Object.entries(r.i).map(([id,q])=>({k:r.id+id,label:ING[id].n,q:qty(id,q)})):null,meta:`1 persona · ${kcal(r)} kcal · ${eur(cost(r))}`,done:()=>{const k='mc_done_'+wk(),a=ls.get(k,[]);if(!a.includes(slot))a.push(slot);ls.set(k,a)}});
}
function openSunday(){
  const S=sunday(),steps=[];
  steps.push({h:'Antes de empezar',t:`Vas a dejar listos ${S.cook.length} platos en unas ${hm(S.mins)}. Saca ${S.cook.length} tápers, cinta y rotulador para etiquetar.`});
  if(S.A)steps.push({h:'Arroz para la semana',t:`Pon a cocer ${S.A} g de arroz en una olla grande con agua y sal. Activa el temporizador y sigue con lo siguiente.`,s:1020});
  if(S.P)steps.push({h:'Pasta para la semana',t:`En otra olla, cuece ${S.P} g de macarrones en agua con sal.`,s:600});
  if(S.H)steps.push({h:'Huevos duros',t:`Cuece ${S.H} huevos en agua hirviendo. Después, enfríalos en agua fría y guárdalos con cáscara en la nevera.`,s:600});
  S.cook.forEach((o,k)=>{
    const h=`${k+1}/${S.cook.length} · ${o.r.n}`;
    domSteps(o.r).forEach(([t,s])=>steps.push({h,t,s}));
    const w=store(o.r,o.d);
    steps.push({h,t:`Al táper. Etiqueta: «${slotName(o.slot)} – ${o.r.n}». Cuando se temple, a ${w==='nevera'?'la nevera':'el congelador'}.`});
    if(k===0&&(S.A||S.P))steps.push({h:'Arroz y pasta',t:'Escurre el arroz y la pasta. Extiéndelos en una bandeja o plato grande para que se enfríen rápido. Echa un chorrito de aceite a la pasta para que no se pegue.'});
  });
  const p=plan(wk()),mon=[p.C[0],p.N[0]].filter(x=>x&&x.i.merluza);
  steps.push({h:'Para terminar',t:`Nada fuera de la nevera más de 2 horas. Recoge y friega.${mon.length?' Y esta noche pasa la merluza del lunes a la nevera.':''}`});
  openFlow({title:'Sesión del domingo',steps,done:()=>ls.set('mc_sun_'+wk(),true)});
}
function closeCook(){$('#cook').classList.remove('open');document.body.style.overflow='';try{wl&&wl.release()}catch(e){}wl=null;C=null;render()}
function drawCook(){
  const n=C.steps.length;$('#cn').textContent=C.title;
  $('#cp').style.width=((C.i+1)/(n+(C.ingList?1:0))*100)+'%';
  $('#cprev').style.visibility=C.i<=(C.ingList?-1:0)?'hidden':'visible';
  if(C.i<0){
    const got=ls.get('mc_prep',[]);
    $('#cbody').innerHTML=`<div class="stepn">Antes de empezar · ${C.meta||''}</div><div class="stept">Saca esto y déjalo a mano</div><div class="ings">`+
      C.ingList.map(o=>`<button class="item ${got.includes(o.k)?'on':''}" data-p="${o.k}"><span class="box">${got.includes(o.k)?'✓':''}</span><span class="nm">${o.label}</span><span class="q">${o.q}</span></button>`).join('')+
      `</div><p style="color:var(--mute);font-size:15px">Y además: sal y lo básico de despensa.</p>`;
    $('#cnext').textContent='Empezar';
  }else{
    const st=C.steps[C.i];
    $('#cbody').innerHTML=`<div class="stepn">Paso ${C.i+1} de ${n}${st.h?' · '+st.h:''}</div><div class="stept">${st.t}</div>`+
      (st.s?`<button class="tbtn" id="tgo">⏱ Temporizador ${mmss(st.s)}</button>`:'');
    $('#cnext').textContent=C.i===n-1?'Terminado':'Siguiente';
    if(st.s)$('#tgo').onclick=()=>startTimer(st.s,`Paso ${C.i+1}`);
  }
  $('#cbody').scrollTop=0;
}

// ---------- EVENTOS ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;render();scrollTo(0,0)}
  else if(t.dataset.c){unlock();openDish(t.dataset.c,t.dataset.s)}
  else if(t.id==='sun'){unlock();openSunday()}
  else if(t.dataset.b){const k='mc_buy_'+wk(),a=ls.get(k,[]),i=a.indexOf(t.dataset.b);i<0?a.push(t.dataset.b):a.splice(i,1);ls.set(k,a);render()}
  else if(t.dataset.p){const a=ls.get('mc_prep',[]),i=a.indexOf(t.dataset.p);i<0?a.push(t.dataset.p):a.splice(i,1);ls.set('mc_prep',a.slice(-60));drawCook()}
  else if(t.id==='reset'){ls.set('mc_buy_'+wk(),[]);render()}
  else if(t.dataset.rc){rcat=t.dataset.rc;render()}
  else if(t.dataset.r){rsel=t.dataset.r;const r=RB.find(x=>x.id===rsel);rsrv=r.b;render();scrollTo(0,0)}
  else if(t.dataset.rback){rsel=null;render()}
  else if(t.dataset.rs){rsrv=Math.min(12,Math.max(1,rsrv+ +t.dataset.rs));render()}
  else if(t.dataset.rfav){const a=ls.get('mc_fav',[]),i=a.indexOf(rsel);i<0?a.push(rsel):a.splice(i,1);ls.set('mc_fav',a);render()}
  else if(t.dataset.radd){const a=ls.get('mc_rlist',[]),i=a.findIndex(x=>x.id===rsel);i<0?a.push({id:rsel,s:rsrv}):a[i].s=rsrv;ls.set('mc_rlist',a);render()}
  else if(t.dataset.rcook){unlock();openRB()}
  else if(t.dataset.rdel){ls.set('mc_rlist',ls.get('mc_rlist',[]).filter(x=>x.id!==t.dataset.rdel));render()}
  else if(t.dataset.rk){const a=ls.get('mc_rchk',[]),i=a.indexOf(t.dataset.rk);i<0?a.push(t.dataset.rk):a.splice(i,1);ls.set('mc_rchk',a);render()}
  else if(t.id==='rclear'){ls.set('mc_rlist',[]);ls.set('mc_rchk',[]);render()}
});
document.addEventListener('input',e=>{if(e.target.id==='rs'){rquery=e.target.value;$('#rl').innerHTML=rcards()}});
$('#pw').onclick=()=>{off--;render()};
$('#nw').onclick=()=>{off++;render()};
$('#cx').onclick=closeCook;
$('#cprev').onclick=()=>{if(C.i>(C.ingList?-1:0)){C.i--;drawCook()}};
$('#cnext').onclick=()=>{
  if(C.i<C.steps.length-1){C.i++;drawCook();return}
  C.done&&C.done();closeCook();
};
$('#tstop').onclick=stopTimer;
render();
}
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
